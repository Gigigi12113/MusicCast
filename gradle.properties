# ── 本机（arm64 + bionic）Android 编译的关键设置，勿删 ──────────────
# AGP 默认从 Google Maven 下载 aapt2 原生二进制（x86_64 glibc），
# 在这台 arm64 手机上无法执行，会报 "aapt2 Daemon startup failed"。
# 下面这行让 AGP 改用 Termux 编译的、能在本机跑的 aapt2。
android.aapt2FromMavenOverride=/data/user/0/com.androidharness.app/files/linux/android-toolchain/android-sdk/build-tools/37.0.0/aapt2

android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/data/user/0/com.androidharness.app/files/.harness-scratch
org.gradle.parallel=false
org.gradle.caching=true

kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m
