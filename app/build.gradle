plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.aidigua.musiccast'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aidigua.musiccast'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.2'

        vectorDrawables.useSupportLibrary = true

        // 目标设备是电视/音箱/手机，全 ARM；排除模拟器架构省体积
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=kotlin.RequiresOptIn']
    }

    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/DEPENDENCIES']
        }
    }

    signingConfigs {
        release {
            storeFile file('/data/user/0/com.androidharness.app/files/linux/android-toolchain/release.keystore')
            storePassword 'shy2333sky'
            keyAlias 'release'
            keyPassword 'shy2333sky'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // 体积优化：R8 裁剪未用代码（icons-extended 上万个图标类只用了几十个）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}


dependencies {
    // Compose
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // HTTP 媒体服务器
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // DLNA/UPnP 控制：优先 UPnPCast（JitPack）
    implementation 'com.github.yinnho:UPnPCast:v1.3.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
